<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hotel Room Booking Form</title>
</head>
<body>

    <center>
        <h1>Hotel Room Booking Form</h1>

        <form action="#" method="post">
            <table border="0" cellpadding="5" cellspacing="0">
                <tr>
                    <td align="right"><b>Full Name:</b></td>
                    <td><input type="text" name="fullName" size="25"></td>
                </tr>
                <tr>
                    <td align="right"><b>Email:</b></td>
                    <td><input type="email" name="email" size="25"></td>
                </tr>
                <tr>
                    <td align="right"><b>Phone:</b></td>
                    <td><input type="tel" name="phone" size="25"></td>
                </tr>
                <tr>
                    <td align="right"><b>Check-in Date:</b></td>
                    <td><input type="date" name="checkIn"></td>
                </tr>
                <tr>
                    <td align="right"><b>Check-out Date:</b></td>
                    <td><input type="date" name="checkOut"></td>
                </tr>
                <tr>
                    <td align="right"><b>Room Type:</b></td>
                    <td>
                        <select name="roomType">
                            <option value="single">Single Room</option>
                            <option value="double">Double Room</option>
                            <option value="suite">Suite</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td align="right"><b>Number of Guests:</b></td>
                    <td><input type="number" name="guests" min="1" size="10"></td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <br>
                        <b>Special Requests:</b><br><br>
                        <textarea name="specialRequests" rows="5" cols="48"></textarea>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <br>
                        <input type="submit" value="Book Now">
                        <input type="reset" value="Reset Form">
                    </td>
                </tr>
            </table>
        </form>
    </center>
    <p>
    <b>Name:</b>Harsh Kumar<br>
    <b>Class And Section:</b> ELCE-1<BR>
        <b>Admission No:</b>2026B02310120<br>
</p>

</body>
</html>
